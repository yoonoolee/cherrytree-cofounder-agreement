name: Deploy to Dev

# No `dev` branch exists today, so this runs from the Actions tab (workflow_dispatch);
# day to day, dev is deployed locally with npm run deploy:dev.
on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    name: Build and Deploy to Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/functions ci

      - name: Create apps/web/.env.production file for dev build
        run: |
          cat > apps/web/.env.production << EOF
          # Development Environment
          VITE_APP_URL=${{ secrets.DEV_APP_URL }}
          VITE_FIREBASE_API_KEY=${{ secrets.DEV_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.DEV_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.DEV_RECAPTCHA_SITE_KEY }}
          VITE_ENFORCE_HTTPS=false
          VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.DEV_CLERK_PUBLISHABLE_KEY }}
          VITE_USE_EMULATORS=false
          VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          EOF

      # The ci job already ran every check; this builds apps/web/dist with this environment's keys.
      - name: Build
        run: npm run build

      - name: Deploy Hosting to Firebase Dev
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'
          channelId: live
          projectId: cherrytree-cofounder-agree-dev
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Functions and Firestore rules/indexes to Firebase Dev
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > $HOME/gcloud-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json
          npx firebase-tools@15 deploy --only functions,firestore:rules,firestore:indexes --project cherrytree-cofounder-agree-dev --non-interactive --force
