name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cherrytree.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Create web/.env.production file
        run: |
          cat > web/.env.production << EOF
          # Production Environment
          VITE_APP_URL=${{ secrets.PROD_APP_URL }}
          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.PROD_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY=${{ secrets.PROD_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.PROD_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.PROD_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY=${{ secrets.PROD_RECAPTCHA_SITE_KEY }}
          VITE_ENFORCE_HTTPS=true
          VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.PROD_CLERK_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          EOF

      # lint + format check + typecheck + tests + production build (web/dist); a red check never deploys
      - name: Check and build
        run: npm run check

      - name: Deploy Hosting to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'
          channelId: live
          projectId: cherrytree-cofounder-agreement
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Functions and Firestore rules/indexes to Firebase Production
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' > $HOME/gcloud-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json
          npx firebase-tools@15 deploy --only functions,firestore:rules,firestore:indexes --project cherrytree-cofounder-agreement --non-interactive --force
