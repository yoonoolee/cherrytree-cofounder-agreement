name: CI

on:
  pull_request:
    branches:
      - master
      - dev

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator (npm run test:rules) is a Java process.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      # Vite inlines VITE_* keys at build time; placeholders keep the CI bundle representative.
      - name: Create web/.env.production for the build
        run: |
          cat > web/.env.production << EOF
          VITE_APP_URL=https://my.cherrytree.app
          VITE_GOOGLE_MAPS_API_KEY=test_key
          VITE_FIREBASE_API_KEY=test_key
          VITE_FIREBASE_AUTH_DOMAIN=test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=test-project
          VITE_FIREBASE_STORAGE_BUCKET=test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=123456789
          VITE_FIREBASE_APP_ID=1:123456789:web:test
          VITE_RECAPTCHA_SITE_KEY=test_key
          VITE_ENFORCE_HTTPS=true
          VITE_CLERK_PUBLISHABLE_KEY=pk_test_test
          EOF

      # lint + format check + typecheck + unit tests + production build (web/dist)
      - name: Check
        run: npm run check

      - name: Unused files, exports and dependencies
        run: npm run knip

      # functions/ has its own lockfile, so the root audit does not cover it.
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix functions audit --audit-level=high

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Firestore rules tests
        run: |
          npm install -g firebase-tools@15
          npm run test:rules
