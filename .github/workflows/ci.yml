name: CI

on:
  pull_request:
    branches:
      - master
      - dev

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create web/.env.production for build test
        run: |
          cat > web/.env.production << EOF
          # CI Build Test Environment
          VITE_APP_URL=https://my.cherrytree.app
          VITE_GOOGLE_MAPS_API_KEY=test_key
          VITE_FIREBASE_API_KEY=test_key
          VITE_FIREBASE_AUTH_DOMAIN=test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=test-project
          VITE_FIREBASE_STORAGE_BUCKET=test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=123456789
          VITE_FIREBASE_APP_ID=1:123456789:web:test
          VITE_RECAPTCHA_SITE_KEY=test_key
          VITE_ENFORCE_HTTPS=true
          VITE_CLERK_PUBLISHABLE_KEY=pk_test_test
          EOF

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build directory not found!"
            exit 1
          fi
          echo "✅ Build successful - ready for deployment"
