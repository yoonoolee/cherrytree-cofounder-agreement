<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/cherrytree-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Cherrytree makes it easy to create cofounder agreements and determine equity splits."
    />
    <link rel="apple-touch-icon" href="/cherrytree-192.png" />

    <!-- Open Graph (used by iMessage, WhatsApp, LinkedIn, Slack, Discord, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cherrytree.app/" />
    <meta property="og:title" content="Cherrytree - Create Cofounder Agreements" />
    <meta
      property="og:description"
      content="Cherrytree makes it easy to create cofounder agreements and determine equity splits."
    />
    <meta property="og:image" content="https://cherrytree.app/cherrytree-512.png" />

    <!-- Twitter Card (optional, Twitter falls back to Open Graph if not present) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://cherrytree.app/" />
    <meta property="twitter:title" content="Cherrytree - Create Cofounder Agreements" />
    <meta
      property="twitter:description"
      content="Cherrytree makes it easy to create cofounder agreements and determine equity splits."
    />
    <meta property="twitter:image" content="https://cherrytree.app/cherrytree-512.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cherrytree.app/" />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Cherrytree",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": [
          {
            "@type": "Offer",
            "name": "Starter",
            "price": "200",
            "priceCurrency": "USD",
            "description": "For individuals to get started with real-time collaboration and instant agreement generation"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "800",
            "priceCurrency": "USD",
            "description": "Everything in Starter, plus attorney review, cofounder coaching, and priority support"
          }
        ],
        "description": "Cherrytree makes it easy to create cofounder agreements and determine equity splits.",
        "url": "https://cherrytree.app",
        "image": "https://cherrytree.app/cherrytree-512.png",
        "provider": {
          "@type": "Organization",
          "name": "Cherrytree",
          "url": "https://cherrytree.app"
        }
      }
    </script>

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Cherrytree",
        "url": "https://cherrytree.app",
        "logo": "https://cherrytree.app/cherrytree-512.png",
        "description": "Cherrytree makes it easy to create cofounder agreements and determine equity splits.",
        "foundingDate": "2024",
        "sameAs": ["https://cherrytree.beehiiv.com/"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Customer Support",
          "email": "tim@cherrytree.app"
        }
      }
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://tally.so/widgets/embed.js"></script>
    <title>Cherrytree - Create Cofounder Agreements</title>
